apiVersion: apps/v1
kind: Deployment
metadata:
  name: aurealize-cards
spec:
  replicas: 1
  progressDeadlineSeconds: 180
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels:
      app.kubernetes.io/name: aurealize-cards
  template:
    metadata:
      labels:
        app.kubernetes.io/name: aurealize-cards
    spec:
      terminationGracePeriodSeconds: 15
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: aurealize-cards
          image: localhost/aurealize-cards:latest
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: APP_ORIGIN
              value: https://aurealize.aureal.dev
            - name: PORT
              value: "3000"
          envFrom:
            - secretRef:
                name: aurealize-cards-env
          readinessProbe:
            httpGet:
              path: /api/health/ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
